<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Portfolio CMS — Jaxon Stickler</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* Tell the browser this UI is already dark. Without it, Edge/Chrome "force dark"
     repaints the white .ad-btn to dark-on-dark, making Save look like it's missing. */
  :root { color-scheme: dark; }
  :root {
    --bg: #0b0c0d; --panel: #151619; --panel2: #1c1e22; --line: rgba(255,255,255,0.12);
    --line2: rgba(255,255,255,0.07); --txt: #f3f3f3; --dim: rgba(255,255,255,0.55);
    --dim2: rgba(255,255,255,0.35); --accent: #7CFFB2; --danger: #ff6b6b;
  }
  html, body { background: var(--bg); color: var(--txt); height: 100%; }
  body { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; -webkit-font-smoothing: antialiased; line-height: 1.5; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  input, textarea, select, button { font-family: inherit; font-size: 13px; color: inherit; }
  textarea { resize: vertical; }
  a { color: var(--accent); }

  .ad-field-label { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; display: block; }
  .ad-input, .ad-textarea, .ad-select {
    width: 100%; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 11px; color: var(--txt); outline: none;
  }
  .ad-input:focus, .ad-textarea:focus, .ad-select:focus { border-color: rgba(124,255,178,0.6); }
  .ad-textarea { min-height: 90px; line-height: 1.55; }
  .ad-btn {
    background: #fff; color: #000; border: 1px solid #fff; border-radius: 8px;
    padding: 9px 16px; font-weight: 600; cursor: pointer; letter-spacing: 0.02em;
    forced-color-adjust: none; -webkit-text-fill-color: #000;
  }
  .ad-btn:hover { background: #e7e7e7; }
  .ad-btn.ghost { background: transparent; color: var(--txt); border: 1px solid var(--line); -webkit-text-fill-color: var(--txt); }
  .ad-btn.ghost:hover { background: rgba(255,255,255,0.06); }
  .ad-btn.danger { background: transparent; color: var(--danger); border: 1px solid rgba(255,107,107,0.4); -webkit-text-fill-color: var(--danger); }
  .ad-btn.danger:hover { background: rgba(255,107,107,0.1); }
  .ad-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ad-chip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 20px; padding: 4px 10px; font-size: 12px;
  }
  .ad-chip button { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 14px; line-height: 1; }
  .ad-chip button:hover { color: var(--danger); }
</style>
</head>
<body>
<div id="admin-root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>

<!-- current site data -->
<script src="layout.js"></script>
<script src="content.js"></script>
<script src="supabase-config.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>

<!-- admin app -->
<script type="text/babel" src="admin-editors.jsx"></script>
<script type="text/babel" src="admin-editors2.jsx"></script>
<script type="text/babel" src="admin-app.jsx"></script>
</body>
</html>
