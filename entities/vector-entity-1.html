<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vector Entity — living edges</title>
<style>
  :root{
    /* All strokes are white. The two source tiers are kept distinct only by
       opacity: bold lines solid, faint construction lines barely there.     */
    --ink:          #ffffff;   /* the bold strokes (source #000000)          */
    --pencil:       #ffffff;   /* the construction lines (source #696969)    */
    --pencil-alpha: 1;
  }

  html,body{ height:100%; margin:0; }

  .stage{
    position:fixed; inset:0;
    display:grid; place-items:center;
    pointer-events:none;              /* never blocks UI when used as overlay */
  }
  #entity{
    height:88vh; width:auto; max-width:94vw;
    display:block;
    overflow:visible;                 /* swaying / curling tips never clip    */
  }

  #entity path[stroke="#000000"]{ stroke: var(--ink); }
  #entity path[stroke="#696969"]{ stroke: var(--pencil); opacity: var(--pencil-alpha); }

  /* Transparent page: overlay this entity on your site.
     The strokes are white, so place it over dark content.               */
  html,body{ background: transparent; }
  body{ overflow:hidden; }
</style>
</head>

    <path d="M417.8049,592.36926 L422.59973,594.5266 L425.87772,601.3837 L425.77133,601.90466" stroke="#000000" stroke-width="1.4173229" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M417.8049,592.36926 L417.0173,591.6044 L413.3606,588.96246" stroke="#000000" stroke-width="1.4173229" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <path d="M436.65863,607.6484 L436.27948,606.4351 L436.5701,608.7447 L437.69562,610.9665" stroke="#000000" stroke-width="1.4173229" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M441.95544,610.87756 L440.2427,608.52826" stroke="#000000" stroke-width="1.4173229" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M446.38635,603.6907 L448.4031,601.50916 L452.18402,599.3317" stroke="#000000" stroke-width="1.4173229" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M448.11484,590.05115 L446.824,597.5086 L446.91486,597.96924" stroke="#000000" stroke-width="1.4173229" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M446.44534,599.3248 L452.58435,585.39044" stroke="#000000" stroke-width="1.4173229" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M438.42062,595.4338 L438.2091,595.273" stroke="#000000" stroke-width="1.4173229" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M417.73917,582.79333 L418.52292,583.35156 L429.9087,589.76794 L437.3703,594.7346" stroke="#000000" stroke-width="1.4173229" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M488.3442,578.6202 L483.6493,580.2796 L479.49515,584.4822 L474.5626,585.8666 L470.55487,589.6003 L464.98248,590.77216 L460.82584,593.6072 L457.04425,593.85535 L451.6895,595.2647 L445.45917,600.8849 L445.61923,601.8056" stroke="#000000" stroke-width="1.4173229" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <script>
  (function () {
    "use strict";

    // ===================== TUNABLES =====================================
    // --- Gentle endpoint sway (the whole perimeter) ---------------------
    var SELECT_FRACTION = 0.12;                   // furthest ~12% of tips sway
    var AMP_MIN = 1.0, AMP_MAX = 3.0;             // sway amplitude (px), capped at 3
    var SWAY_MIN_S   = 6.0,  SWAY_MAX_S   = 13.0;
    var SECOND_MIN_S = 2.6,  SECOND_MAX_S = 4.6;
    var TWITCH_MIN_S = 0.7,  TWITCH_MAX_S = 1.5;
    var W_SWAY = 0.72, W_SECOND = 0.20, W_TWITCH = 0.08;
    var COINCIDENT_EPS = 1.2;

    // --- Violent twitch + curl, then a settling momentum ----------------
    var TWITCH_GAP_MIN = 3.5, TWITCH_GAP_MAX = 5.5;  // seconds between events (~4s)
    var TWITCH_DUR_MIN = 3.0, TWITCH_DUR_MAX = 4.2;  // full event incl. settle (s)
    var TWITCH_POOL    = 10;                         // # of longest lines eligible
    var MIN_VERTS_CURL = 6;
    var ONLY_BOLD      = true;                       // limit to the bold (#000000) layer
    var CURL_MIN = 0.5,  CURL_MAX = 0.9;            // peak tip curl angle (radians)
    var CURL_POW = 2.2;                             // concentrates the curl at the tip
    var SHAKE_AMP_MIN = 7,  SHAKE_AMP_MAX = 14;     // peak shake at the tip (px)
    var SHAKE_FREQ_MIN = 22, SHAKE_FREQ_MAX = 34;   // shake frequency (rad/s) = "violent"
    // Momentum / settle: after the flick the curl angle rings down like a
    // damped pendulum (overshoots rest, sways back, decays), then blends
    // smoothly into the gentle sway.
    var RING_MIN_S = 1.1, RING_MAX_S = 2.0;         // settle sway period (s)
    var RING_DECAY_MIN = 0.9, RING_DECAY_MAX = 1.5; // damping time-constant (s)
    var TWITCH_FADE = 1.1;                          // hand-off to sway over last (s)
    var SHAKE_TAU = 0.10;                           // violent shake decay (s)
    var RISE_T    = 0.12;                           // curl attack time (s)
    // ====================================================================

    var TAU = Math.PI * 2;
    var rnd   = function (a, b) { return a + Math.random() * (b - a); };
    var clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
    var smooth= function (x) { x = x < 0 ? 0 : (x > 1 ? 1 : x); return x * x * (3 - 2 * x); };
    var r3    = function (n) { return Math.round(n * 1000) / 1000; };

    // --- Minimal SVG path parser (absolute M / L / Z only) --------------
    function parsePathData(d) {
      var struct = [], verts = [];
      var re = /([a-zA-Z])|(-?\d*\.?\d+(?:[eE][+-]?\d+)?)/g;
      var m, cmd = null, buf = [];
      function commit() {
        if (cmd === null) return;
        var C = cmd.toUpperCase();
        if (C === "Z") { struct.push({ cmd: "Z" }); }
        else if (C === "M" || C === "L") {
          for (var i = 0; i + 1 < buf.length; i += 2) {
            var c = (C === "M" && i === 0) ? "M" : "L";
            var e = { cmd: c, x: buf[i], y: buf[i + 1], ox: buf[i], oy: buf[i + 1] };
            struct.push(e); verts.push(e);
          }
        }
        buf = [];
      }
      while ((m = re.exec(d))) {
        if (m[1] !== undefined) { commit(); cmd = m[1]; }
        else { buf.push(parseFloat(m[2])); }
      }
      commit();
      return { struct: struct, verts: verts };
    }

    function buildPathData(struct) {
      var out = "";
      for (var i = 0; i < struct.length; i++) {
        var e = struct[i];
        if (e.cmd === "Z") { out += "Z "; continue; }
        out += e.cmd + r3(e.x) + "," + r3(e.y) + " ";
      }
      return out;
    }

    function init() {
      var svg = document.getElementById("entity");
      if (!svg) return;

      var pathEls = svg.querySelectorAll("path");
      var paths = [];
      for (var i = 0; i < pathEls.length; i++) {
        var parsed = parsePathData(pathEls[i].getAttribute("d") || "");
        if (parsed.verts.length === 0) continue;
        paths.push({ el: pathEls[i], struct: parsed.struct, verts: parsed.verts, animated: false });
      }
      if (!paths.length) return;

      var bb = svg.getBBox();
      var cx = bb.x + bb.width / 2;
      var cy = bb.y + bb.height / 2;

      // ---------- gentle endpoint sway -----------------------------------
      var nodeMap = Object.create(null);
      function addEndpoint(pathObj, entry) {
        var key = Math.round(entry.ox / COINCIDENT_EPS) + ":" + Math.round(entry.oy / COINCIDENT_EPS);
        var node = nodeMap[key];
        if (!node) { node = { x: entry.ox, y: entry.oy, members: [], dist: 0 }; nodeMap[key] = node; }
        node.members.push({ entry: entry, pathObj: pathObj });
      }
      for (var p = 0; p < paths.length; p++) {
        var v = paths[p].verts;
        addEndpoint(paths[p], v[0]);
        if (v.length > 1) addEndpoint(paths[p], v[v.length - 1]);
      }
      var nodes = [];
      for (var k in nodeMap) { var n = nodeMap[k]; n.dist = Math.hypot(n.x - cx, n.y - cy); nodes.push(n); }
      var sorted = nodes.map(function (nn) { return nn.dist; }).sort(function (a, b) { return a - b; });
      var thresh  = sorted[Math.floor(sorted.length * (1 - SELECT_FRACTION))];
      var maxDist = sorted[sorted.length - 1];
      var span = Math.max(1e-6, maxDist - thresh);

      function makeOscSet(amp) {
        return { amp: amp, osc: [
          [W_SWAY,   TAU / rnd(SWAY_MIN_S,   SWAY_MAX_S),   rnd(0, TAU)],
          [W_SECOND, TAU / rnd(SECOND_MIN_S, SECOND_MAX_S), rnd(0, TAU)],
          [W_TWITCH, TAU / rnd(TWITCH_MIN_S, TWITCH_MAX_S), rnd(0, TAU)]
        ] };
      }
      function evalOsc(set, t) {
        var s = 0, o = set.osc;
        for (var j = 0; j < o.length; j++) s += o[j][0] * Math.sin(o[j][1] * t + o[j][2]);
        return set.amp * s;
      }

      var animatedNodes = [];
      for (var a = 0; a < nodes.length; a++) {
        var node = nodes[a];
        if (node.dist < thresh) continue;
        var ramp = (node.dist - thresh) / span;
        var base = AMP_MIN + (AMP_MAX - AMP_MIN) * ramp;
        node.ax = makeOscSet(clamp(base * rnd(0.8, 1.15), 0.4, AMP_MAX));
        node.ay = makeOscSet(clamp(base * rnd(0.8, 1.15), 0.4, AMP_MAX));
        for (var mi = 0; mi < node.members.length; mi++) node.members[mi].pathObj.animated = true;
        animatedNodes.push(node);
      }

      // ---------- twitch pool: the longest (bold) lines ------------------
      var pool = [];
      for (var pi = 0; pi < paths.length; pi++) {
        var pv = paths[pi].verts;
        if (pv.length < MIN_VERTS_CURL) continue;
        if (ONLY_BOLD && paths[pi].el.getAttribute("stroke") !== "#000000") continue;
        var len = 0;
        for (var j2 = 1; j2 < pv.length; j2++)
          len += Math.hypot(pv[j2].ox - pv[j2 - 1].ox, pv[j2].oy - pv[j2 - 1].oy);
        pool.push({ pathObj: paths[pi], len: len });
      }
      pool.sort(function (x, y) { return y.len - x.len; });
      pool = pool.slice(0, TWITCH_POOL);
      var twitchLines = pool.map(function (pp, ix) {
        return { id: ix, pathObj: pp.pathObj, verts: pp.pathObj.verts };
      });
      twitchLines.forEach(function (L) { precomputeLine(L); });

      function oi(L, kk) { return L.tipAtEnd ? kk : (L.verts.length - 1 - kk); }

      function precomputeLine(L) {
        var v = L.verts, nn = v.length;
        var cum = new Array(nn); cum[0] = 0;
        for (var i = 1; i < nn; i++) cum[i] = cum[i - 1] + Math.hypot(v[i].ox - v[i - 1].ox, v[i].oy - v[i - 1].oy);
        var total = cum[nn - 1] || 1;
        var dF = Math.hypot(v[0].ox - cx, v[0].oy - cy);
        var dL = Math.hypot(v[nn - 1].ox - cx, v[nn - 1].oy - cy);
        L.tipAtEnd = dL >= dF;                       // free (animated) end
        L.s = new Array(nn);
        for (var i2 = 0; i2 < nn; i2++) { var f = cum[i2] / total; L.s[i2] = L.tipAtEnd ? f : (1 - f); }
        L.kw = new Array(nn - 1); var sum = 0;
        for (var kk = 0; kk < nn - 1; kk++) {
          var idxKp1 = L.tipAtEnd ? (kk + 1) : (nn - 1 - (kk + 1));
          var w = Math.pow(L.s[idxKp1], CURL_POW); L.kw[kk] = w; sum += w;
        }
        if (sum > 0) for (var k2 = 0; k2 < nn - 1; k2++) L.kw[k2] /= sum;
        L.phx = new Array(nn); L.phy = new Array(nn); L._cx = new Array(nn); L._cy = new Array(nn);
        for (var i3 = 0; i3 < nn; i3++) { L.phx[i3] = Math.random() * TAU; L.phy[i3] = Math.random() * TAU; }
        L.upSign = curlTipDy(L, 0.6) > 0 ? -1 : 1;   // sign that lifts the tip "up"
      }

      function curlTipDy(L, theta) {
        var v = L.verts, nn = v.length, Qx = v[oi(L, 0)].ox, Qy = v[oi(L, 0)].oy, phi = 0;
        for (var kk = 0; kk < nn - 1; kk++) {
          var a = v[oi(L, kk)], b = v[oi(L, kk + 1)];
          var sx = b.ox - a.ox, sy = b.oy - a.oy;
          phi += theta * L.kw[kk];
          var c = Math.cos(phi), s = Math.sin(phi);
          Qx += sx * c - sy * s; Qy += sx * s + sy * c;
        }
        return Qy - v[oi(L, nn - 1)].oy;
      }

      function resetLine(L) { var v = L.verts; for (var i = 0; i < v.length; i++) { v[i].x = v[i].ox; v[i].y = v[i].oy; } }

      // curl (damped-ring momentum) + violent shake, blended back into sway
      function applyTwitch(ev, t) {
        var L = ev.line, v = L.verts, nn = v.length, tau = t - ev.start;

        // curl angle: fast rise, then a damped pendulum ring (the momentum)
        var theta;
        if (tau < RISE_T) { theta = ev.thetaPeak * smooth(tau / RISE_T); }
        else { var td = tau - RISE_T; theta = ev.thetaPeak * Math.exp(-td / ev.ringDecay) * Math.cos(ev.ringW * td); }

        // violent shake: sharp onset, quick decay (gone before the settle)
        var envS = Math.min(1, tau / 0.04) * Math.exp(-tau / SHAKE_TAU);

        // blend weight: hold the line under twitch control, then hand back to
        // the gentle sway over the final TWITCH_FADE seconds (seamless).
        var fadeStart = ev.dur - ev.tFade;
        var W = tau <= fadeStart ? 1 : (1 - smooth((tau - fadeStart) / ev.tFade));

        // current gentle-sway offset on the two endpoints (set by the sway pass)
        var last = nn - 1;
        var sdx0 = v[0].x - v[0].ox, sdy0 = v[0].y - v[0].oy;
        var sdxN = v[last].x - v[last].ox, sdyN = v[last].y - v[last].oy;

        // cumulative-rotation curl, base -> tip
        var b0 = oi(L, 0), Qx = v[b0].ox, Qy = v[b0].oy, phi = 0;
        L._cx[b0] = Qx; L._cy[b0] = Qy;
        for (var kk = 0; kk < nn - 1; kk++) {
          var a = v[oi(L, kk)], b = v[oi(L, kk + 1)];
          var sx = b.ox - a.ox, sy = b.oy - a.oy;
          phi += theta * L.kw[kk];
          var c = Math.cos(phi), s = Math.sin(phi);
          Qx += sx * c - sy * s; Qy += sx * s + sy * c;
          var bi = oi(L, kk + 1); L._cx[bi] = Qx; L._cy[bi] = Qy;
        }

        // compose: rest + W*(curl+shake - rest) + sway*(1-W)
        for (var i = 0; i < nn; i++) {
          var amp = envS * ev.shakeAmp * Math.pow(L.s[i], 1.5);
          var tox = L._cx[i] + amp * Math.sin(ev.shakeFreq * t + L.phx[i]);
          var toy = L._cy[i] + amp * Math.sin(ev.shakeFreq * 1.07 * t + L.phy[i]);
          var swx = i === 0 ? sdx0 : (i === last ? sdxN : 0);
          var swy = i === 0 ? sdy0 : (i === last ? sdyN : 0);
          v[i].x = v[i].ox + W * (tox - v[i].ox) + swx * (1 - W);
          v[i].y = v[i].oy + W * (toy - v[i].oy) + swy * (1 - W);
        }
      }

      // ---------- render set + scheduler ---------------------------------
      var animatedPaths = paths.filter(function (pp) { return pp.animated; });
      var renderSet = animatedPaths.slice();
      animatedPaths.forEach(function (pp) { pp._inSet = true; });
      twitchLines.forEach(function (L) { if (!L.pathObj._inSet) { L.pathObj._inSet = true; renderSet.push(L.pathObj); } });

      if (!animatedNodes.length && !twitchLines.length) return;

      var activeEvents = [];
      var nextTwitchT = rnd(1.5, 3.0);
      var lastLineId = -1;
      function maybeSpawn(t) {
        if (t < nextTwitchT || !twitchLines.length) return;
        nextTwitchT = t + rnd(TWITCH_GAP_MIN, TWITCH_GAP_MAX);
        var busy = Object.create(null);
        for (var e = 0; e < activeEvents.length; e++) busy[activeEvents[e].line.id] = true;
        var cands = [];
        for (var j = 0; j < twitchLines.length; j++)
          if (twitchLines[j].id !== lastLineId && !busy[twitchLines[j].id]) cands.push(twitchLines[j]);
        if (!cands.length) return;
        var L = cands[(Math.random() * cands.length) | 0];
        lastLineId = L.id;
        activeEvents.push({
          line: L, start: t, dur: rnd(TWITCH_DUR_MIN, TWITCH_DUR_MAX),
          thetaPeak: L.upSign * rnd(CURL_MIN, CURL_MAX),
          shakeAmp: rnd(SHAKE_AMP_MIN, SHAKE_AMP_MAX),
          shakeFreq: rnd(SHAKE_FREQ_MIN, SHAKE_FREQ_MAX),
          ringW: TAU / rnd(RING_MIN_S, RING_MAX_S),
          ringDecay: rnd(RING_DECAY_MIN, RING_DECAY_MAX),
          tFade: TWITCH_FADE
        });
      }

      // ---------- requestAnimationFrame loop -----------------------------
      var clock = 0, last = null, raf = 0;
      function frame(now) {
        if (last === null) last = now;
        var dt = (now - last) / 1000; if (dt > 0.05) dt = 0.05;
        last = now; clock += dt;
        var t = clock;

        maybeSpawn(t);

        // 1) gentle sway on every selected perimeter endpoint
        for (var i = 0; i < animatedNodes.length; i++) {
          var nd = animatedNodes[i];
          var dx = evalOsc(nd.ax, t), dy = evalOsc(nd.ay, t);
          var mem = nd.members;
          for (var j = 0; j < mem.length; j++) {
            mem[j].entry.x = mem[j].entry.ox + dx;
            mem[j].entry.y = mem[j].entry.oy + dy;
          }
        }

        // 2) twitch + curl + settling momentum (overrides its line, blends back)
        for (var e = activeEvents.length - 1; e >= 0; e--) {
          var ev = activeEvents[e];
          if ((t - ev.start) >= ev.dur) { resetLine(ev.line); activeEvents.splice(e, 1); continue; }
          applyTwitch(ev, t);
        }

        // 3) rebuild only the paths that move
        for (var r = 0; r < renderSet.length; r++)
          renderSet[r].el.setAttribute("d", buildPathData(renderSet[r].struct));

        raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame(frame);

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
        else if (!raf) { last = null; raf = requestAnimationFrame(frame); }
      });
    }

    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      /* reduced motion: leave the drawing perfectly still */
    } else if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else { init(); }
  })();
