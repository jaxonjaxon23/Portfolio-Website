  <script>
  (function () {
    "use strict";

    // ===================== TUNABLES =====================================
    // Only paths with class="tendril" are animated (the 25 longest tendrils).
    var TENDRIL_SELECTOR = ".tendril";

    // --- Gentle sway on each tendril's free tip -------------------------
    var AMP_MIN = 13, AMP_MAX = 30;                 // sway amplitude (px) at the tip — big ambient movement
    var SWAY_FALLOFF_POW = 1.35;                    // <1 = more of the branch visibly bends, not just the tip
    var SWAY_MIN_S   = 6.0,  SWAY_MAX_S   = 13.0;
    var SECOND_MIN_S = 2.6,  SECOND_MAX_S = 4.6;
    var TWITCH_MIN_S = 0.7,  TWITCH_MAX_S = 1.5;
    var W_SWAY = 0.72, W_SECOND = 0.20, W_TWITCH = 0.08;
    var COINCIDENT_EPS = 1.5;

    // --- Violent twitch + curl, then settling momentum ------------------
    var TWITCH_GAP_MIN = 3.5, TWITCH_GAP_MAX = 5.5;  // seconds between events (~4s)
    var TWITCH_DUR_MIN = 3.0, TWITCH_DUR_MAX = 4.2;  // full event incl. settle (s)
    var TWITCH_POOL    = 25;                         // any of the 25 may twitch
    var MIN_VERTS_CURL = 6;                          // need enough vertices to curl
    var CURL_MIN = 0.10, CURL_MAX = 0.22;           // peak tip curl angle (radians)
    var CURL_POW = 2.2;
    var SHAKE_AMP_MIN = 7,  SHAKE_AMP_MAX = 14;     // peak shake at the tip (px)
    var SHAKE_FREQ_MIN = 22, SHAKE_FREQ_MAX = 34;   // shake frequency (rad/s)
    var RING_MIN_S = 1.1, RING_MAX_S = 2.0;         // settle sway period (s)
    var RING_DECAY_MIN = 0.9, RING_DECAY_MAX = 1.5; // damping time-constant (s)
    var TWITCH_FADE = 1.1;                          // hand-off to sway over last (s)
    var SHAKE_TAU = 0.10, RISE_T = 0.12;
    // ====================================================================

    var TAU = Math.PI * 2;
    var rnd   = function (a, b) { return a + Math.random() * (b - a); };
    var clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
    var smooth= function (x) { x = x < 0 ? 0 : (x > 1 ? 1 : x); return x * x * (3 - 2 * x); };
    var r3    = function (n) { return Math.round(n * 1000) / 1000; };

    function parsePathData(d) {
      var struct = [], verts = [];
      var re = /([a-zA-Z])|(-?\d*\.?\d+(?:[eE][+-]?\d+)?)/g;
      var m, cmd = null, buf = [];
      function commit() {
        if (cmd === null) return;
        var C = cmd.toUpperCase();
        if (C === "Z") { struct.push({ cmd: "Z" }); }
        else if (C === "M" || C === "L") {
          for (var i = 0; i + 1 < buf.length; i += 2) {
            var c = (C === "M" && i === 0) ? "M" : "L";
            var e = { cmd: c, x: buf[i], y: buf[i + 1], ox: buf[i], oy: buf[i + 1] };
            struct.push(e); verts.push(e);
          }
        }
        buf = [];
      }
      while ((m = re.exec(d))) {
        if (m[1] !== undefined) { commit(); cmd = m[1]; }
        else { buf.push(parseFloat(m[2])); }
      }
      commit();
      return { struct: struct, verts: verts };
    }

    function buildPathData(struct) {
      var out = "";
      for (var i = 0; i < struct.length; i++) {
        var e = struct[i];
        if (e.cmd === "Z") { out += "Z "; continue; }
        out += e.cmd + r3(e.x) + "," + r3(e.y) + " ";
      }
      return out;
    }

    function init() {
      var svg = document.getElementById("entity");
      if (!svg) return;

      var els = svg.querySelectorAll(TENDRIL_SELECTOR);
      var paths = [];
      for (var i = 0; i < els.length; i++) {
        var parsed = parsePathData(els[i].getAttribute("d") || "");
        if (parsed.verts.length === 0) continue;
        paths.push({ el: els[i], struct: parsed.struct, verts: parsed.verts, animated: false });
      }
      if (!paths.length) return;

      var bb = svg.getBBox();                      // geometric centre of the whole entity
      var cx = bb.x + bb.width / 2;
      var cy = bb.y + bb.height / 2;

      // ---------- gentle sway: each tendril's FREE tip -------------------
      var nodeMap = Object.create(null);
      function addEndpoint(pathObj, entry) {
        var key = Math.round(entry.ox / COINCIDENT_EPS) + ":" + Math.round(entry.oy / COINCIDENT_EPS);
        var node = nodeMap[key];
        if (!node) { node = { x: entry.ox, y: entry.oy, members: [], dist: 0 }; nodeMap[key] = node; }
        node.members.push({ entry: entry, pathObj: pathObj });
      }
      // per-path arc-length falloff weight (0 at the anchored base, 1 at the
      // free tip) so ambient sway bends the WHOLE branch, not just its tip vertex.
      function computeSwayFalloff(pathObj) {
        var v = pathObj.verts, nn = v.length;
        if (nn < 2) { pathObj.sw = [1]; return; }
        var cum = new Array(nn); cum[0] = 0;
        for (var i = 1; i < nn; i++) cum[i] = cum[i - 1] + Math.hypot(v[i].ox - v[i - 1].ox, v[i].oy - v[i - 1].oy);
        var total = cum[nn - 1] || 1;
        var dF = Math.hypot(v[0].ox - cx, v[0].oy - cy);
        var dL = Math.hypot(v[nn - 1].ox - cx, v[nn - 1].oy - cy);
        var tipAtEnd = dL >= dF;
        pathObj.sw = new Array(nn);
        for (var i2 = 0; i2 < nn; i2++) {
          var f = cum[i2] / total;
          var frac = tipAtEnd ? f : (1 - f);
          pathObj.sw[i2] = Math.pow(frac, SWAY_FALLOFF_POW);
        }
      }
      for (var p = 0; p < paths.length; p++) {
        var v = paths[p].verts;
        if (v.length === 1) { addEndpoint(paths[p], v[0]); continue; }
        var f = v[0], l = v[v.length - 1];
        var df = Math.hypot(f.ox - cx, f.oy - cy), dl = Math.hypot(l.ox - cx, l.oy - cy);
        addEndpoint(paths[p], dl >= df ? l : f);   // animate only the far (free) tip
        computeSwayFalloff(paths[p]);
      }
      var nodes = [];
      for (var k in nodeMap) { var n = nodeMap[k]; n.dist = Math.hypot(n.x - cx, n.y - cy); nodes.push(n); }
      var dmin = Infinity, dmax = -Infinity;
      for (var a0 = 0; a0 < nodes.length; a0++) { dmin = Math.min(dmin, nodes[a0].dist); dmax = Math.max(dmax, nodes[a0].dist); }

      function makeOscSet(amp) {
        return { amp: amp, osc: [
          [W_SWAY,   TAU / rnd(SWAY_MIN_S,   SWAY_MAX_S),   rnd(0, TAU)],
          [W_SECOND, TAU / rnd(SECOND_MIN_S, SECOND_MAX_S), rnd(0, TAU)],
          [W_TWITCH, TAU / rnd(TWITCH_MIN_S, TWITCH_MAX_S), rnd(0, TAU)]
        ] };
      }
      function evalOsc(set, t) {
        var s = 0, o = set.osc;
        for (var j = 0; j < o.length; j++) s += o[j][0] * Math.sin(o[j][1] * t + o[j][2]);
        return set.amp * s;
      }

      var animatedNodes = [];
      for (var a = 0; a < nodes.length; a++) {
        var node = nodes[a];
        var ramp = (node.dist - dmin) / dspan;      // furthest tips sway a touch more
        var base = AMP_MIN + (AMP_MAX - AMP_MIN) * ramp;
        node.ax = makeOscSet(clamp(base * rnd(0.8, 1.15), 0.4, AMP_MAX));
        node.ay = makeOscSet(clamp(base * rnd(0.8, 1.15), 0.4, AMP_MAX));
        for (var mi = 0; mi < node.members.length; mi++) node.members[mi].pathObj.animated = true;
        animatedNodes.push(node);
      }

      // ---------- twitch pool: tendrils long enough to curl --------------
      var pool = [];
      for (var pi = 0; pi < paths.length; pi++) {
        var pv = paths[pi].verts;
        if (pv.length < MIN_VERTS_CURL) continue;
        var len = 0;
        for (var j2 = 1; j2 < pv.length; j2++)
          len += Math.hypot(pv[j2].ox - pv[j2 - 1].ox, pv[j2].oy - pv[j2 - 1].oy);
        pool.push({ pathObj: paths[pi], len: len });

      pool.sort(function (x, y) { return y.len - x.len; });
      pool = pool.slice(0, TWITCH_POOL);
      var twitchLines = pool.map(function (pp, ix) { return { id: ix, pathObj: pp.pathObj, verts: pp.pathObj.verts }; });
      twitchLines.forEach(function (L) { precomputeLine(L); });

      function oi(L, kk) { return L.tipAtEnd ? kk : (L.verts.length - 1 - kk); }

      function precomputeLine(L) {
        var v = L.verts, nn = v.length;
        var cum = new Array(nn); cum[0] = 0;
        for (var i = 1; i < nn; i++) cum[i] = cum[i - 1] + Math.hypot(v[i].ox - v[i - 1].ox, v[i].oy - v[i - 1].oy);
        var total = cum[nn - 1] || 1;
        var dF = Math.hypot(v[0].ox - cx, v[0].oy - cy);
        var dL = Math.hypot(v[nn - 1].ox - cx, v[nn - 1].oy - cy);
        L.tipAtEnd = dL >= dF;
        L.s = new Array(nn);
        for (var i2 = 0; i2 < nn; i2++) { var f = cum[i2] / total; L.s[i2] = L.tipAtEnd ? f : (1 - f); }
        L.kw = new Array(nn - 1); var sum = 0;
        for (var kk = 0; kk < nn - 1; kk++) {
          var idxKp1 = L.tipAtEnd ? (kk + 1) : (nn - 1 - (kk + 1));
          var w = Math.pow(L.s[idxKp1], CURL_POW); L.kw[kk] = w; sum += w;
        }
        if (sum > 0) for (var k2 = 0; k2 < nn - 1; k2++) L.kw[k2] /= sum;
        L.phx = new Array(nn); L.phy = new Array(nn); L._cx = new Array(nn); L._cy = new Array(nn);
        for (var i3 = 0; i3 < nn; i3++) { L.phx[i3] = Math.random() * TAU; L.phy[i3] = Math.random() * TAU; }
        L.upSign = curlTipDy(L, 0.6) > 0 ? -1 : 1;
      }

      function curlTipDy(L, theta) {
        var v = L.verts, nn = v.length, Qx = v[oi(L, 0)].ox, Qy = v[oi(L, 0)].oy, phi = 0;
        for (var kk = 0; kk < nn - 1; kk++) {
          var a = v[oi(L, kk)], b = v[oi(L, kk + 1)];
          var sx = b.ox - a.ox, sy = b.oy - a.oy;
          phi += theta * L.kw[kk];
          var c = Math.cos(phi), s = Math.sin(phi);
          Qx += sx * c - sy * s; Qy += sx * s + sy * c;
        }
        return Qy - v[oi(L, nn - 1)].oy;
      }

      function resetLine(L) { var v = L.verts; for (var i = 0; i < v.length; i++) { v[i].x = v[i].ox; v[i].y = v[i].oy; } }

      function applyTwitch(ev, t) {
        var L = ev.line, v = L.verts, nn = v.length, tau = t - ev.start;
        var theta;
        if (tau < RISE_T) { theta = ev.thetaPeak * smooth(tau / RISE_T); }
        else { var td = tau - RISE_T; theta = ev.thetaPeak * Math.exp(-td / ev.ringDecay) * Math.cos(ev.ringW * td); }
        var envS = Math.min(1, tau / 0.04) * Math.exp(-tau / SHAKE_TAU);
        var fadeStart = ev.dur - ev.tFade;
        var W = tau <= fadeStart ? 1 : (1 - smooth((tau - fadeStart) / ev.tFade));

        var last = nn - 1;
        var sdx0 = v[0].x - v[0].ox, sdy0 = v[0].y - v[0].oy;
        var sdxN = v[last].x - v[last].ox, sdyN = v[last].y - v[last].oy;

        var b0 = oi(L, 0), Qx = v[b0].ox, Qy = v[b0].oy, phi = 0;
        L._cx[b0] = Qx; L._cy[b0] = Qy;
        for (var kk = 0; kk < nn - 1; kk++) {
          var a = v[oi(L, kk)], b = v[oi(L, kk + 1)];
          var sx = b.ox - a.ox, sy = b.oy - a.oy;
          phi += theta * L.kw[kk];
          var c = Math.cos(phi), s = Math.sin(phi);
          Qx += sx * c - sy * s; Qy += sx * s + sy * c;
          var bi = oi(L, kk + 1); L._cx[bi] = Qx; L._cy[bi] = Qy;
        }
        for (var i = 0; i < nn; i++) {
          var amp = envS * ev.shakeAmp * Math.pow(L.s[i], 1.5);
          var tox = L._cx[i] + amp * Math.sin(ev.shakeFreq * t + L.phx[i]);
          var toy = L._cy[i] + amp * Math.sin(ev.shakeFreq * 1.07 * t + L.phy[i]);
          var swx = i === 0 ? sdx0 : (i === last ? sdxN : 0);
          var swy = i === 0 ? sdy0 : (i === last ? sdyN : 0);
          v[i].x = v[i].ox + W * (tox - v[i].ox) + swx * (1 - W);
          v[i].y = v[i].oy + W * (toy - v[i].oy) + swy * (1 - W);
        }
      }

      var animatedPaths = paths.filter(function (pp) { return pp.animated; });
      var renderSet = animatedPaths.slice();
      animatedPaths.forEach(function (pp) { pp._inSet = true; });
      twitchLines.forEach(function (L) { if (!L.pathObj._inSet) { L.pathObj._inSet = true; renderSet.push(L.pathObj); } });
      if (!animatedNodes.length && !twitchLines.length) return;

      var activeEvents = [];
      var nextTwitchT = rnd(1.5, 3.0);
      var lastLineId = -1;
      function maybeSpawn(t) {
        if (t < nextTwitchT || !twitchLines.length) return;
        nextTwitchT = t + rnd(TWITCH_GAP_MIN, TWITCH_GAP_MAX);
        var busy = Object.create(null);
        for (var e = 0; e < activeEvents.length; e++) busy[activeEvents[e].line.id] = true;
        var cands = [];
        for (var j = 0; j < twitchLines.length; j++)
          if (twitchLines[j].id !== lastLineId && !busy[twitchLines[j].id]) cands.push(twitchLines[j]);
        if (!cands.length) return;
        var L = cands[(Math.random() * cands.length) | 0];
        lastLineId = L.id;
        activeEvents.push({
          line: L, start: t, dur: rnd(TWITCH_DUR_MIN, TWITCH_DUR_MAX),
          thetaPeak: L.upSign * rnd(CURL_MIN, CURL_MAX),
          shakeAmp: rnd(SHAKE_AMP_MIN, SHAKE_AMP_MAX),
          shakeFreq: rnd(SHAKE_FREQ_MIN, SHAKE_FREQ_MAX),
          ringW: TAU / rnd(RING_MIN_S, RING_MAX_S),
          ringDecay: rnd(RING_DECAY_MIN, RING_DECAY_MAX),
          tFade: TWITCH_FADE
        });
      }

      var clock = 0, last = null, raf = 0;
      function frame(now) {
        if (last === null) last = now;
        var dt = (now - last) / 1000; if (dt > 0.05) dt = 0.05;
        last = now; clock += dt;
        var t = clock;

        maybeSpawn(t);

        for (var i = 0; i < animatedNodes.length; i++) {
          var nd = animatedNodes[i];
          var dx = evalOsc(nd.ax, t), dy = evalOsc(nd.ay, t);
          var mem = nd.members;
          for (var j = 0; j < mem.length; j++) {
            var po = mem[j].pathObj, sw = po.sw, vv = po.verts;
            if (sw && vv.length > 1) {
              for (var kx = 0; kx < vv.length; kx++) {
                vv[kx].x = vv[kx].ox + dx * sw[kx];
                vv[kx].y = vv[kx].oy + dy * sw[kx];
              }
            } else {
              mem[j].entry.x = mem[j].entry.ox + dx;
              mem[j].entry.y = mem[j].entry.oy + dy;
            }
          }
        }

        for (var e = activeEvents.length - 1; e >= 0; e--) {
          var ev = activeEvents[e];
          if ((t - ev.start) >= ev.dur) { resetLine(ev.line); activeEvents.splice(e, 1); continue; }
          applyTwitch(ev, t);
        }

        for (var r = 0; r < renderSet.length; r++)
          renderSet[r].el.setAttribute("d", buildPathData(renderSet[r].struct));

        raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame(frame);

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
        else if (!raf) { last = null; raf = requestAnimationFrame(frame); }
      });
    }

    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      /* reduced motion: leave the drawing perfectly still */
    } else if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else { init(); }
  })();
  </script>
